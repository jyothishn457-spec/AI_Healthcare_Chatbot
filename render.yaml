# Render Blueprint - deploy backend + frontend.
# Docs: https://render.com/docs/blueprint-spec
#
# To deploy:
#   1. Create a free account at https://render.com
#   2. New +  ->  Blueprint  ->  connect this GitHub repo
#   3. Render reads this file, creates both services, and asks you to fill in
#      the GEMINI_API_KEY secret (marked sync: false). Paste your key.
#   4. Deploy. Backend URL: https://ai-healthcare-backend-<rand>.onrender.com
#      Frontend URL:  https://ai-healthcare-frontend-<rand>.onrender.com
services:
  - type: web
    name: ai-healthcare-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health

    envVars:
      # Pin Python to 3.12: Render's default (3.14) has no prebuilt wheels for
      # our pinned Rust-based deps (onnxruntime, pydantic-core, tokenizers,
      # tiktoken), forcing a from-source build that needs Cargo and fails.
      - key: PYTHON_VERSION
        value: "3.12.11"
      # Provider settings
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # Secrets - fill these in the Render dashboard (never store in git)
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Auto-created admin login
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        value: admin123
      # Storage paths (ephemeral on Render's free tier - ChromaDB, SQLite
      # and uploaded docs are reset whenever the service restarts or redeploys)
      - key: DATABASE_URL
        value: sqlite:///./chatbot.db
      - key: CHROMA_DIR
        value: ./chroma_db
      # Sample documents live in the repo and are auto-indexed on first start
      - key: DATA_DIR
        value: ../data/medical_documents

  # Frontend - React (Vite) static site.
  - type: web
    name: ai-healthcare-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    branch: main
    autoDeployTrigger: commit

    envVars:
      # Base URL of the deployed backend (no /api prefix - routes live at root).
      - key: VITE_API_URL
        value: https://ai-healthcare-backend-jxmh.onrender.com
